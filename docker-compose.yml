services:
  game-watchdog:
    image: ghcr.io/hidea88/game-server-watchdog:latest
    container_name: game-watchdog
    restart: unless-stopped
    user: root
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - ALLOWED_CHANNEL_IDS=${ALLOWED_CHANNEL_IDS}
      - ALLOWED_USER_IDS=${ALLOWED_USER_IDS}
      - DOCKER_COMPOSE_PATH=/config/docker-compose.yml
      - DOCKER_COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME:-game-server}
      - DEBUG_MODE=${DEBUG_MODE:-false}
    volumes:
      # Docker ソケット（必須）
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # ゲームサーバーの docker-compose.yml（必須）
      - ./docker-compose.yml:/config/docker-compose.yml:ro
      # ホストのシステム情報にアクセス（監視機能用）
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "pgrep", "-f", "game-server-watchdog"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  minecraft:
    image: itzg/minecraft-bedrock-server
    container_name: minecraft-bedrock-server
    labels:
      # game-watchdogが認識するためのラベル
      - "game.type=minecraft"
    volumes:
      - ./games/minecraft/data:/data
      - ./games/minecraft/data/worlds:/data/worlds
      - ./shared/logs:/var/log/minecraft
    ports:
      - "19132:19132/udp" # IPv4 gameplay
      - "19133:19133/udp" # IPv6 gameplay
    environment:
      - EULA=TRUE
      - GAMEMODE=survival
      - DIFFICULTY=normal
      - LEVEL_NAME=${MINECRAFT_LEVEL_NAME:-Bedrock level}
      - ALLOW_CHEATS=false
      - MAX_PLAYERS=10
      - ONLINE_MODE=true
      - WHITE_LIST=false
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 16G
        reservations:
          cpus: '2'
          memory: 4G
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "-v", "localhost", "19132"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  rust:
    image: didstopia/rust-server
    container_name: rust-server
    labels:
      # game-watchdogが認識するためのラベル
      - "game.type=rust"
    ports:
      - "5584:5584/udp"  # game
      - "5585:5585/udp"  # queryport
      - "5586:5586/tcp"  # RCON
      - "5584:5584/tcp"  # optional TCP
      - "8080:8080"
    volumes:
      - rustds-data:/steamcmd/rust
      - ./games/rust/logs:/steamcmd/rust/logs
    environment:
      TZ: Asia/Tokyo
      RUST_SERVER_STARTUP_ARGUMENTS: -batchmode -nographics +server.port 5584 +server.queryport 5585 +rcon.port 5586 +decay.scale 0.3
      RUST_SERVER_IDENTITY: ${RUST_SERVER_IDENTITY:-rust}
      RUST_SERVER_SEED: ${RUST_SERVER_SEED:-1234568}
      RUST_SERVER_NAME: ${RUST_SERVER_NAME:-Rust dedicated server}
      RUST_SERVER_DESCRIPTION: ${RUST_SERVER_DESCRIPTION:-A playroom for PlusUltra members.}
      RUST_SERVER_URL: ${RUST_SERVER_URL:-https://xxx.xxx.xxx/}
      RUST_SERVER_BANNER_URL: ${RUST_SERVER_BANNER_URL:-http://xxx.xxx.xxx/banner.jpg}
      RUST_RCON_PASSWORD: ${RUST_RCON_PASSWORD:-xxxxxxxxxxxxxxxx}
      RUST_UPDATE_CHECKING: ${RUST_UPDATE_CHECKING:-1}
      RUST_SERVER_WORLDSIZE: ${RUST_SERVER_WORLDSIZE:-3500}
      RUST_SERVER_MAXPLAYERS: ${RUST_SERVER_MAXPLAYERS:-15}
      RUST_SERVER_SAVE_INTERVAL: ${RUST_SERVER_SAVE_INTERVAL:-300}
      RUST_OXIDE_ENABLED: 1
    deploy:
      resources:
        limits:
          cpus: '8'
          memory: 64G
        reservations:
          cpus: '2'
          memory: 8G
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pgrep", "RustDedicated"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  palworld:
      image: thijsvanloef/palworld-server-docker:latest
      restart: unless-stopped
      container_name: palworld-server
      stop_grace_period: 30s # Set to however long you are willing to wait for the container to gracefully stop
      ports:
        - 9680:9680/udp
        - 9681:9681/udp
        # - 8212:8212/tcp  # Port for REST API if REST_API_ENABLED: true
      environment:
         PUID: 1000
         PGID: 1000
         PORT: 9680 # Optional but recommended
         QUERY_PORT: 9681
         PLAYERS: 16 # Optional but recommended
         PAL_EGG_DEFAULT_HATCHING_TIME: "3"
         PLAYER_STOMACH_DECREASE_RATE: "0.8"
         PAL_STOMACH_DECREASE_RATE: "0.5"
         NIGHTTIME_SPEEDRATE: "1.25"
         BUILD_OBJECT_DETERIORATION_DAMAGE_RATE: "0"
         SERVER_PASSWORD: ${PALWORLD_SERVER_PASSWORD:?Set PALWORLD_SERVER_PASSWORD in .env}
         REST_API_ENABLED: true
         REST_API_PORT: 8212
         # グローバルパルボックスの出し入れを許可（Importはイメージのデフォルトが False）
         ALLOW_GLOBAL_PALBOX_EXPORT: "True"
         ALLOW_GLOBAL_PALBOX_IMPORT: "True"
         BASE_CAMP_MAX_NUM_IN_GUILD: 7  # ギルド当たりの拠点数（デフォルト4／公式上限10）
         BASE_CAMP_WORKER_MAX_NUM: 25
         DISABLE_GENERATE_SETTINGS: true
         TZ: "UTC"
         ADMIN_PASSWORD: ${PALWORLD_ADMIN_PASSWORD:?Set PALWORLD_ADMIN_PASSWORD in .env}
         COMMUNITY: true  # Enable this if you want your server to show up in the community servers tab, USE WITH SERVER_PASSWORD!
         PUBLIC_IP: ${PALWORLD_PUBLIC_IP:?Set PALWORLD_PUBLIC_IP in .env}
         PUBLIC_PORT: ${PALWORLD_PUBLIC_PORT:-9680}
         SERVER_NAME: "${PALWORLD_SERVER_NAME:?Set PALWORLD_SERVER_NAME in .env}"
         SERVER_DESCRIPTION: "${PALWORLD_SERVER_DESCRIPTION:-}"
         CROSSPLAY_PLATFORMS: "(Steam,Xbox,PS5,Mac)"
      volumes:
         - ./games/palworld:/palworld/

  ark-island:
    build: .
    image: acekorneya/asa_server:latest
    container_name: ark-island
    labels:
      # game-watchdogが認識するためのラベル
      - "game.type=ark"
    restart: unless-stopped
    environment:
      - PUID=1001
      - PGID=1001
      - BATTLEEYE=FALSE
      - RCON_ENABLED=TRUE
      - DISPLAY_POK_MONITOR_MESSAGE=FALSE
      - UPDATE_SERVER=TRUE
      - CHECK_FOR_UPDATE_INTERVAL=24
      - UPDATE_WINDOW_MINIMUM_TIME=12:00 AM
      - UPDATE_WINDOW_MAXIMUM_TIME=11:59 PM
      - RESTART_NOTICE_MINUTES=30
      - ENABLE_MOTD=FALSE
      - MOTD=
      - MOTD_DURATION=30
      - MAP_NAME=TheIsland
      - SESSION_NAME=${ARK_ISLAND_SESSION_NAME:-ark-island}
      - SERVER_ADMIN_PASSWORD=${ARK_SERVER_ADMIN_PASSWORD:-adminpassword}
      - SERVER_PASSWORD=${ARK_SERVER_PASSWORD:-password}
      - ASA_PORT=7777
      - RCON_PORT=27020
      - MAX_PLAYERS=19
      - CLUSTER_ID=cluster
      - MOD_IDS=933975,929868,935528
      - CUSTOM_SERVER_ARGS=
    ports:
      - "7777:7777/tcp"
      - "7777:7777/udp"
    volumes:
      - "./games/ark/ASA_Island:/usr/games/.wine/drive_c/POK/Steam/steamapps/common/ARK Survival Ascended Dedicated Server/ShooterGame"
      - "./games/ark/Dedicated Server:/usr/games/.wine/drive_c/POK/Steam/steamapps/common/ARK Survival Ascended Dedicated Server"
      - "./games/ark/Cluster:/usr/games/.wine/drive_c/POK/Steam/steamapps/common/ShooterGame"
    deploy:
      resources:
        limits:
          memory: 32G
    healthcheck:
      test: ["CMD", "pgrep", "ShooterGameServer"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

  ark-scorched:
    build: .
    image: acekorneya/asa_server:latest
    container_name: ark-scorched
    labels:
      # game-watchdogが認識するためのラベル
      - "game.type=ark"
    restart: unless-stopped
    environment:
      - PUID=1001
      - PGID=1001
      - BATTLEEYE=FALSE
      - RCON_ENABLED=TRUE
      - DISPLAY_POK_MONITOR_MESSAGE=FALSE
      - UPDATE_SERVER=TRUE
      - CHECK_FOR_UPDATE_INTERVAL=24
      - UPDATE_WINDOW_MINIMUM_TIME=12:00 AM
      - UPDATE_WINDOW_MAXIMUM_TIME=11:59 PM
      - RESTART_NOTICE_MINUTES=30
      - ENABLE_MOTD=FALSE
      - MOTD=
      - MOTD_DURATION=30
      - MAP_NAME=ScorchedEarth
      - SESSION_NAME=${ARK_SCORCHED_SESSION_NAME:-ark-scorched}
      - SERVER_ADMIN_PASSWORD=${ARK_SERVER_ADMIN_PASSWORD:-adminpassword}
      - SERVER_PASSWORD=${ARK_SERVER_PASSWORD:-password}
      - ASA_PORT=7778
      - RCON_PORT=27021
      - MAX_PLAYERS=19
      - CLUSTER_ID=cluster
      - MOD_IDS=933975,929868,935528
      - CUSTOM_SERVER_ARGS=
    ports:
      - "7778:7778/tcp"
      - "7778:7778/udp"
    volumes:
      - "./games/ark/scorchedEarth/ASA_scorchedEarth:/usr/games/.wine/drive_c/POK/Steam/steamapps/common/ARK Survival Ascended Dedicated Server/ShooterGame"
      - "./games/ark/scorchedEarth/Dedicated_Server:/usr/games/.wine/drive_c/POK/Steam/steamapps/common/ARK Survival Ascended Dedicated Server"
      - "./games/ark/Cluster:/usr/games/.wine/drive_c/POK/Steam/steamapps/common/ShooterGame"
    deploy:
      resources:
        limits:
          memory: 32G
    healthcheck:
      test: ["CMD", "pgrep", "ShooterGameServer"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

volumes:
  rustds-data:

networks:
  default:
    external: true
    name: game-server_default
